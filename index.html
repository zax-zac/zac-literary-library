<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#29433d"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>강작가 문학 서재 모바일</title><link rel="stylesheet" href="app.css"></head><body><header><h1>📚 강작가 문학 서재</h1><small>모바일 v0.1 · 기기 내 저장 · 수동 동기화</small></header><main><div id="status" role="status" aria-live="polite">작품을 추가하거나 서재 파일을 가져오세요.</div><section class="panel"><h2>내 서재 <span id="count">0편</span></h2><div class="toolbar"><button id="newBook">+ 새 작품</button><button id="exportBackup">서재 백업 내보내기</button><label class="filelabel">서재 파일 가져오기<input id="importBackup" type="file" accept=".json,application/json" hidden></label></div><input id="search" placeholder="제목 · 작가 검색" aria-label="서재 검색"><div id="books"></div><p class="note">백업 JSON을 Google Drive에 올린 후 다른 기기에서 가져오면 작품을 합칠 수 있습니다. 자동 동기화는 아직 아닙니다.</p></section><section class="panel" id="editor" hidden><h2>작품 편집</h2><label>제목<input id="title" placeholder="작품 제목"></label><label>작가<input id="author" placeholder="작가 / 필자"></label><label>원문 주소<input id="url" type="url" placeholder="https://..."></label><label>원문 (웹페이지에서 복사해 붙여넣기)<textarea id="original" rows="7"></textarea></label><div class="toolbar"><button id="copyPrompt">ChatGPT 번역용 복사</button><button id="openChat">ChatGPT 열기</button></div><p class="note">갤럭시 크롬에서는 다른 웹사이트 본문을 자동으로 읽지 못할 수 있습니다. 원문을 직접 복사하거나 공유한 주소를 기록하세요.</p><label>한국어 번역문<textarea id="translation" rows="12" placeholder="완성된 번역문을 붙여넣으세요"></textarea></label><div class="toolbar"><button id="saveBook" class="primary">작품 저장</button><button id="preview">읽기 화면</button><button id="saveHTML">HTML</button><button id="saveEPUB">EPUB</button><button id="saveTXT">TXT</button><button id="deleteBook" class="danger">작품 삭제</button></div></section><section class="panel" id="reader" hidden><div class="toolbar"><button id="closeReader">읽기 닫기</button></div><div id="reading"></div></section></main><script src="shared.js"></script><script src="app.js"></script></body></html>
